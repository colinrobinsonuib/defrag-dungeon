<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Defrag Dungeon</title>
  <link rel="stylesheet" href="./overworld/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body class="dark-mode">
  <div class="cyber-grid-bg"></div>
  <div class="ambient-glow" id="ambient-glow"></div>

  <!-- Cyber Header -->
  <header>
    <div class="logo-area">
      <span class="logo-icon">👾</span>
      <div class="logo-text-group">
        <h1>DEFRAG DUNGEON</h1>
        <span class="sub-badge">SYSTEM RECOVERY OVERWORLD</span>
      </div>
    </div>
    <div class="header-controls">
      <span id="progress-indicator">Sector 1 of 5</span>
      <div class="nav-btn-group">
        <button id="prev-nav-btn" class="icon-btn" title="Previous Sector (←)">◀</button>
        <button id="next-nav-btn" class="icon-btn" title="Next Sector (→)">▶</button>
      </div>
      <button id="shuffle-btn">Shuffle</button>
      <button id="reset-btn">Reset</button>
    </div>
  </header>

  <!-- Interactive 3D Corridor Stage -->
  <div class="dungeon-stage" id="dungeon-stage">
    <!-- Stage Arrows -->
    <button class="stage-arrow arrow-left" id="stage-arrow-left" aria-label="Previous Sector">
      <span class="arrow-icon">◀</span>
    </button>
    <button class="stage-arrow arrow-right" id="stage-arrow-right" aria-label="Next Sector">
      <span class="arrow-icon">▶</span>
    </button>

    <!-- Horizontal Carousel Viewport -->
    <div class="track-viewport" id="track-viewport">
      <main id="room-list" class="room-track">
        <!-- Rendered dynamically -->
      </main>
    </div>

    <!-- Sector Track Navigation Indicator -->
    <div class="track-dots" id="track-dots">
      <!-- Generated dynamically -->
    </div>
  </div>

  <!-- Completion Summary -->
  <div id="dungeon-summary" class="dungeon-summary">
    <div class="summary-card">
      <div class="summary-badge">MISSION COMPLETE</div>
      <h2>ALL SECTORS DEFRAGMENTED</h2>
      <p id="summary-text" style="margin: 12px 0;"></p>
      <button id="replay-btn" class="glow-btn">Replay Dungeon Run</button>
    </div>
  </div>

  <!-- Room Modal Overlay -->
  <div id="room-overlay" class="room-overlay">
    <div class="overlay-header">
      <div class="overlay-room-meta">
        <div id="overlay-color-indicator" class="overlay-color-indicator"></div>
        <span id="overlay-title" class="overlay-title">Room Title</span>
      </div>

      <div class="overlay-center">
        <div id="overlay-timer" class="overlay-timer">100.0s</div>
        <div id="grace-indicator" class="grace-indicator">Grace: 5.0s</div>
      </div>

      <div class="overlay-controls">
        <button id="start-btn" class="start-btn">Start Room</button>
        <button id="exit-btn">Exit</button>
      </div>
    </div>

    <div class="iframe-container" id="iframe-container">
      <iframe id="room-iframe" class="room-iframe" allow="autoplay; fullscreen"></iframe>

      <div id="result-banner" class="result-banner">
        <div id="result-title" class="result-title">Room Complete</div>
        <div id="result-text">Result text</div>
      </div>
    </div>
  </div>

  <script src="./overworld/app.js"></script>
</body>
</html>
