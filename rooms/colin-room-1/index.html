<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" />
<title>GRID ECLIPSE: Circuit Break</title>
<style>
:root{--ink:#06192b;--teal:#006875;--gold:#ffba13;--orange:#ff4a08;--paper:#ffe3b5;--cyan:#24e9ce}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--ink);font-family:Impact,Haettenschweiler,'Arial Narrow Bold',sans-serif;color:var(--paper);overflow:hidden}
#wrap{height:100%;display:grid;place-items:center;background:radial-gradient(circle at 55% 34%,#087f83 0 11%,#006875 24%,#06192b 67%)}
#game{position:relative;width:min(100vw,760px);height:min(100vh,1000px);overflow:hidden;border:8px solid var(--paper);box-shadow:0 0 0 3px #092333 inset;touch-action:none}
canvas{width:100%;height:100%;display:block}
#hud{position:absolute;inset:16px 18px auto;display:flex;justify-content:space-between;pointer-events:none;text-shadow:2px 2px #071628;color:var(--gold);font:22px Impact,sans-serif;letter-spacing:1px}
#center{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:28px;background:linear-gradient(#006875cc,#06192be8)}
h1{font-size:clamp(48px,10vw,86px);line-height:.82;margin:0;color:var(--orange);letter-spacing:2px}h2{font-size:clamp(22px,5vw,40px);margin:10px 0;color:var(--gold)}p{max-width:480px;font-family:Arial,sans-serif;font-weight:700;line-height:1.35;margin:8px auto 22px}button{border:0;background:var(--gold);color:var(--ink);font:24px Impact,sans-serif;padding:13px 28px;cursor:pointer;box-shadow:6px 6px var(--orange)}small{display:block;margin-top:20px;font-family:Arial,sans-serif;color:#fff1cf}.hide{display:none!important}
</style>
</head><body><div id="wrap"><div id="game"><canvas id="c"></canvas><div id="hud"><span id="score">SCORE 0000 / 1000</span><span id="lives">SIGNAL ◆◆◆</span></div><div id="center"><h2>WHERE CIRCUITS DREAM</h2><h1>GRID<br>ECLIPSE</h1><p>The saucer has locked onto the grid. Slip between its scanning beams and collect glowing circuit nodes to reach 1000 points before the signal collapses.</p><button id="start">ENTER THE GRID</button><small>Move: ← → / A D · or drag/touch<br>Collect cyan nodes (+100). Avoid orange beams.</small></div></div></div>
<script>
const c=document.querySelector('#c'),x=c.getContext('2d'),game=document.querySelector('#game'),overlay=document.querySelector('#center'),scoreEl=document.querySelector('#score'),livesEl=document.querySelector('#lives');
let W,H,running=false,score=0,lives=3,t=0,last=0,player,nodes=[],beams=[],spawn=0,completed=false;
const WIN_SCORE=1000;

function reportComplete(success, resultText) {
  if (completed) return;
  completed = true;
  running = false;
  window.parent.postMessage({
    type: 'defrag:complete',
    success: Boolean(success),
    result: String(resultText)
  }, '*');
}

// Protocol listener
window.addEventListener('message', (event) => {
  if (!event.data) return;
  if (event.data.type === 'defrag:start') {
    start();
  }
  if (event.data.type === 'defrag:timeout') {
    reportComplete(score >= WIN_SCORE, `Time expired! Reached ${Math.floor(score)} points.`);
  }
});

function resize(){W=c.width=game.clientWidth*devicePixelRatio;H=c.height=game.clientHeight*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);W=game.clientWidth;H=game.clientHeight;if(player)player.y=H-95}addEventListener('resize',resize);resize();
function reset(){score=0;lives=3;t=spawn=0;nodes=[];beams=[];player={x:W/2,y:H-95,r:16,v:0,inv:0};updateHud()}
function updateHud(){scoreEl.textContent='SCORE '+String(Math.floor(score)).padStart(4,'0')+' / '+WIN_SCORE;livesEl.textContent='SIGNAL '+('◆'.repeat(lives)||'—')}
function start(){reset();completed=false;running=true;overlay.classList.add('hide');last=performance.now();requestAnimationFrame(loop)}document.querySelector('#start').onclick=start;
let keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(!running&&(e.key==='Enter'||e.key===' '))start()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
function point(e){let r=c.getBoundingClientRect();return Math.max(25,Math.min(W-25,e.clientX-r.left))}c.addEventListener('pointerdown',e=>{if(running)player.x=point(e)});c.addEventListener('pointermove',e=>{if(running&&e.buttons)player.x=point(e)});
function circleHit(a,b){let dx=a.x-b.x,dy=a.y-b.y;return dx*dx+dy*dy<(a.r+b.r)**2}
function spawnNode(){nodes.push({x:35+Math.random()*(W-70),y:-20,r:9,s:110+score*.03,p:Math.random()*7})}
function spawnBeam(){let bw=Math.max(44,W*.085);beams.push({x:20+Math.random()*(W-bw-40),y:-130,w:bw,h:125,s:155+score*.04})}
function drawBg(){x.fillStyle='#006875';x.fillRect(0,0,W,H);let g=x.createRadialGradient(W*.56,H*.28,20,W*.56,H*.28,W*.52);g.addColorStop(0,'#058c89');g.addColorStop(1,'#003c54');x.fillStyle=g;x.fillRect(0,0,W,H);
 x.strokeStyle='#24e9ce33';x.lineWidth=1;for(let yy=H*.48;yy<H;yy+=32){x.beginPath();x.moveTo(0,yy);x.lineTo(W,yy);x.stroke()}for(let i=-6;i<7;i++){x.beginPath();x.moveTo(W/2,H*.43);x.lineTo(W/2+i*105,H);x.stroke()}
 // saucer
 x.save();x.translate(W/2,H*.23);x.strokeStyle='#ffba13';x.lineWidth=3;x.fillStyle='#075b69';x.beginPath();x.ellipse(0,0,W*.29,25,0,0,Math.PI*2);x.fill();x.stroke();x.fillStyle='#087f83';x.beginPath();x.arc(0,-2,W*.16,Math.PI,0);x.fill();x.strokeStyle='#24e9ce';x.stroke();x.restore();
 x.fillStyle='#ff4a0820';x.beginPath();x.moveTo(W*.42,H*.26);x.lineTo(W*.58,H*.26);x.lineTo(W*.72,H);x.lineTo(W*.28,H);x.closePath();x.fill()}
function update(dt){t+=dt;spawn-=dt;if(spawn<=0){Math.random()<.62?spawnNode():spawnBeam();spawn=Math.max(.25,.72-score/7000)}let dir=(keys.arrowright||keys.d?1:0)-(keys.arrowleft||keys.a?1:0);player.x=Math.max(22,Math.min(W-22,player.x+dir*340*dt));player.inv=Math.max(0,player.inv-dt);
 nodes.forEach(n=>{n.y+=n.s*dt;n.p+=dt*5});beams.forEach(b=>b.y+=b.s*dt);
 nodes=nodes.filter(n=>{if(circleHit(player,n)){score+=100;updateHud();if(score>=WIN_SCORE){win();return false}return false}return n.y<H+30});
 beams=beams.filter(b=>{if(player.inv<=0&&player.x+player.r>b.x&&player.x-player.r<b.x+b.w&&player.y+player.r>b.y&&player.y-player.r<b.y+b.h){lives--;player.inv=1.2;updateHud();if(lives<=0)end()}return b.y<H+150});score+=dt*8;updateHud();if(score>=WIN_SCORE){win()}}
function draw(){drawBg();nodes.forEach(n=>{x.shadowBlur=16;x.shadowColor='#24e9ce';x.fillStyle='#24e9ce';x.beginPath();x.arc(n.x,n.y,n.r+Math.sin(n.p)*2,0,7);x.fill();x.shadowBlur=0;x.strokeStyle='#ffba13';x.stroke()});beams.forEach(b=>{x.fillStyle='#ff4a08';x.fillRect(b.x,b.y,b.w,b.h);x.fillStyle='#ff4a08';x.fillRect(b.x+5,b.y,b.w-10,5)});
 if(!player.inv||Math.floor(t*12)%2===0){x.save();x.translate(player.x,player.y);x.fillStyle='#06192b';x.beginPath();x.arc(0,-17,8,0,7);x.fill();x.fillRect(-7,-8,14,32);x.fillRect(-22,2,44,7);x.fillRect(-14,19,9,24);x.fillRect(5,19,9,24);x.restore()}}
function win(){running=false;overlay.classList.remove('hide');overlay.innerHTML=`<h2>SIGNAL RESTORED</h2><h1>${Math.floor(score)}<br>POINTS</h1><p>You slipped through the beams and stabilized the grid!</p><button id="again">ENTER AGAIN</button><small>Collect cyan nodes · Avoid orange beams</small>`;document.querySelector('#again').onclick=start;reportComplete(true,`Signal stabilized! Reached ${Math.floor(score)} points.`);}
function end(){running=false;overlay.classList.remove('hide');overlay.innerHTML=`<h2>SIGNAL LOST</h2><h1>${Math.floor(score)}<br>POINTS</h1><p>The eclipse closed over the grid. Re-enter the circuit and beat the signal.</p><button id="again">TRY AGAIN</button><small>Collect cyan nodes · Avoid orange beams</small>`;document.querySelector('#again').onclick=start;reportComplete(false,`Signal lost! Reached ${Math.floor(score)} points.`);}
function loop(now){if(!running)return;let dt=Math.min(.035,(now-last)/1000);last=now;update(dt);draw();if(running)requestAnimationFrame(loop)}
reset();draw();
</script></body></html>
